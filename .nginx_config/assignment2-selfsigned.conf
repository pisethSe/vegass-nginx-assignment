# Assignment II
# HTTPS: serve the website
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /opt/homebrew/etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/selfsigned.key;

    root /var/www/vegass;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
