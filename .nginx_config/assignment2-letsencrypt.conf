
server {
    listen 443 ssl;
    server_name nginx.getmyportfolio.tech;

    ssl_certificate /opt/homebrew/etc/letsencrypt/live/nginx.getmyportfolio.tech/fullchain.pem;
    ssl_certificate_key /opt/homebrew/etc/letsencrypt/live/nginx.getmyportfolio.tech/privkey.pem;

    root /var/www/vegass;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

